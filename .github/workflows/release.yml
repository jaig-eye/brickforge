name: Release

# Push a tag like v1.1.0 to build the Windows installer and the macOS disk
# images and publish them together. The release stays a draft until every
# file is attached, so the in-app updater never sees a half-finished release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --${{ matrix.target }} --publish never --config electron-builder.config.js

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # This version's section of CHANGELOG.md becomes the release notes
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## [$VERSION]' section in CHANGELOG.md"; exit 1; }
          ls -l release
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "BrickForge $TAG" --notes-file notes.md
          gh release upload "$TAG" --clobber \
            "release/BrickForge-Setup-$VERSION.exe" \
            "release/BrickForge-Setup-$VERSION.exe.blockmap" \
            release/latest.yml \
            "release/BrickForge-$VERSION-mac-arm64.dmg" \
            "release/BrickForge-$VERSION-mac-x64.dmg"
          gh release edit "$TAG" --draft=false --latest --notes-file notes.md
