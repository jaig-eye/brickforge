name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Drives the built app against local stand-ins for every web service
      - name: End-to-end
        run: npm run test:e2e

      - name: Keep the e2e traces when something fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
